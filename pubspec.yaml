name: melo_app
description: "Melo - A modern, friendly meditation and mindfulness companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation & Deep Linking
  go_router: ^14.2.0
  
  # Local Structured Database (Drift / SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Lightweight Key-Value Storage
  shared_preferences: ^2.2.3
  
  # Audio Playback & Audio Session Control
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  
  # Scheduled Notifications
  flutter_local_notifications: ^17.2.2
  
  # Utilities & Formatting
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/
